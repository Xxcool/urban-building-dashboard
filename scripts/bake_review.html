</style><header><h1>A1 · MCP 烘焙样区</h1><small>工程验证 · 尚未启用到主页面</small><button id="plain">实时基线</button><button id="ao">烘焙 AO</button><button id="both" class="active">AO + 间接光</button><button id="reset">复位</button><button id="solo">整屏测量</button></header><main id="compare"><article><h2>已确认楼宇终稿 · 固定视觉依据</h2><div class="frame"><img src="/design/final/building.png"></div></article><article><h2>当前样区 · 同镜头切换烘焙效果</h2><div class="frame" id="canvasWrap"><div class="rail"></div><span class="label">仅评价 A1 静态接触与间接光；UI 和周边还原仍待完成</span></div></article></main><p id="status">加载实际 GLB 与烘焙贴图…</p><p class="note">操作：拖动旋转，滚轮缩放；三种模式共享同一相机、曝光和日光。AO 使用独立 UV2，间接光不含底色或直射光；车辆、水体和选中效果未烘入。这个页面用于验证技术路径，不能代替三场景视觉验收。</p>
